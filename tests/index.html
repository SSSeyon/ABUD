<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engine Tests</title>
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --ok: #1a7f37; --bad: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --muted: #999; --ok: #4ac26b; --bad: #ff6b6b; } }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 960px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #summary { font-weight: 600; margin-bottom: 12px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  li { margin: 2px 0; } .err { color: var(--bad); font-family: ui-monospace, monospace; font-size: 12px; margin-left: 20px; }
</style>
</head>
<body>
<h1>Calculation engine tests</h1>
<div id="summary">Running…</div>
<ul id="list"></ul>
<script type="module">
  import { run } from './harness.js';
  const summary = document.getElementById('summary');
  try {
    await import('./engine/worked-example.test.js');
    await import('./engine/engine.test.js');
    await import('./app/portfolio.test.js');
    await import('./app/history.test.js');
    const { passed, failed, results } = await run();
    window.__testResults = { passed, failed, results };
    summary.textContent = `${passed} passed, ${failed} failed`;
    summary.className = failed ? 'bad' : 'ok';
    const list = document.getElementById('list');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'bad';
      li.textContent = `${r.ok ? '✓' : '✗'} ${r.name}`;
      if (!r.ok) {
        const e = document.createElement('div');
        e.className = 'err';
        e.textContent = r.error;
        li.appendChild(e);
      }
      list.appendChild(li);
    }
  } catch (e) {
    window.__testResults = { loadError: String(e?.stack ?? e) };
    summary.textContent = 'Failed to load tests: ' + (e?.message ?? e);
    summary.className = 'bad';
  }
</script>
</body>
</html>
