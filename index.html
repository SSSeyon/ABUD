<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ABUD Portfolio</title>
<script>
  // Theme before first paint: the saved choice, else the device setting.
  (function () {
    var t = null;
    try { t = localStorage.getItem('abud-theme'); } catch (e) { /* storage blocked */ }
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"><main class="center"><p class="muted">Loading…</p></main></div>
<noscript>This app needs JavaScript.</noscript>
<script type="module" src="src/app/main.js"></script>
</body>
</html>
